[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farkad-ai"
version = "0.6.0"
description = "Turns a sentence, a recording or a photo about your day into structured health entries"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "Farkad", email = "mellah.brahim.redouane@gmail.com" },
]
keywords = [
    "llm",
    "structured-output",
    "multimodal",
    "gemini",
    "evaluation",
    "health",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
google = [
    "google-genai>=2.14.0",
]
anthropic = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.50.0",
]
all-providers = [
    "farkad-ai[google,anthropic,openai]",
]
dev = [
    # anyio, not pytest-asyncio: every async test here is marked `@pytest.mark.anyio`.
    "anyio==4.15.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[project.urls]
Homepage = "https://farkad.web.app"
Repository = "https://github.com/brmel/farkad-ai"
Issues = "https://github.com/brmel/farkad-ai/issues"
Documentation = "https://github.com/brmel/farkad-ai#readme"

[project.scripts]
farkad-ai = "farkad_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["farkad_ai"]

[tool.hatch.build.targets.sdist]
include = [
    "/farkad_ai",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

# Pinned, so a new ruff default does not change what CI checks.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["farkad_ai"]
# An optional adapter's ignore is needed without its SDK and redundant with it.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["google.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true
