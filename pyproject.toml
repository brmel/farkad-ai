[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farkad-ai"
version = "0.2.0"
description = "Provider-agnostic, multimodal two-pass structured extraction engine"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [
    { name = "Farkad", email = "mellah.brahim.redouane@gmail.com" },
]
keywords = [
    "ai",
    "health",
    "multimodal",
    "structured-extraction",
    "routing",
    "clean-architecture",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
google = [
    "google-genai>=2.14.0",
]
anthropic = [
    "anthropic>=0.40.0",
]
openai = [
    "openai>=1.50.0",
]
all-providers = [
    "farkad-ai[google,anthropic,openai]",
]
eval = [
    "tabulate>=0.9.0",
]
dev = [
    # anyio, not pytest-asyncio: every async test here is marked `@pytest.mark.anyio`.
    "anyio>=4.0.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
all = [
    "farkad-ai[all-providers,dev,eval]",
]

[project.urls]
Homepage = "https://farkad.web.app"
Repository = "https://github.com/brmel/farkad-ai"
Issues = "https://github.com/brmel/farkad-ai/issues"
Documentation = "https://github.com/brmel/farkad-ai#readme"

[project.scripts]
farkad-ai = "farkad_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["farkad_ai"]

[tool.hatch.build.targets.wheel.sources]
"farkad_ai" = "farkad_ai"

[tool.hatch.build.targets.sdist]
include = [
    "/farkad_ai",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

# The same set the monorepo selects, so `make check` there and this repository's CI measure one
# standard. Without it a standalone checkout lints by whatever ruff's default is that month.
[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["farkad_ai"]
# An optional adapter must typecheck with its SDK installed and without it. The ignore that the
# fallback assignment needs in the first state is redundant in the second, and no single file
# satisfies both, so the check that would flip between them is off here and only here.
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["google.*", "anthropic.*", "openai.*"]
ignore_missing_imports = true
