version: 2
updates:
  - package-ecosystem: pip
    directory: '/'
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
