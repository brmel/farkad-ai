# This repository is published, so a vulnerable pin here is a vulnerable pin in whatever
# installs `farkad-ai`. One grouped pull request per ecosystem per week.
version: 2
updates:
  - package-ecosystem: pip
    directory: '/'
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
