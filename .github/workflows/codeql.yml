# Free on a public repository, and this one is the only Farkad surface that is public.
# `security-extended` over the default set: the cost is minutes on a small package.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
